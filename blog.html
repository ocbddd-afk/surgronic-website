<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title="meta.blogTitle">Blog — Surgronic</title>
<meta name="description" content="Practical notes on surgical instruments and sourcing, from the Surgronic team.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=blog002">
</head>
<body>
<script src="assets/currency.js"></script>
<script src="app.js?v=brand001"></script>

<main>
<section class="blog-hero">
  <div class="wrap">
    <span class="eyebrow rv">Insights</span>
    <h1 class="rv">From the field.</h1>
    <p class="rv">Practical notes on instruments and sourcing.</p>
  </div>
</section>

<section class="blog-list">
  <div class="wrap">
    <div id="blogGrid" class="blog-grid">
      <!-- Articles loaded by JS -->
    </div>
  </div>
</section>
</main>

<script>
document.addEventListener("DOMContentLoaded", function(){
  SG.mountChrome('');
  SG.applyI18n();
  if(window.SurCcy){ SurCcy.init(function(){}); }
  loadArticles();
});

function loadArticles(){
  fetch('articles/index.json')
    .then(r => r.json())
    .then(data => {
      var grid = document.getElementById('blogGrid');
      if(!data.articles || !data.articles.length){
        grid.innerHTML = '<p class="blog-empty">Articles coming soon.</p>';
        return;
      }
      var html = '';
      data.articles.forEach(function(a){
        html += '<article class="blog-card">' +
          '<p class="blog-date">' + a.date + '</p>' +
          '<h3><a href="article.html?slug=' + a.slug + '">' + a.title + '</a></h3>' +
          '<p class="blog-summary">' + a.summary + '</p>' +
          '<a class="blog-read" href="article.html?slug=' + a.slug + '">Read →</a>' +
          '</article>';
      });
      grid.innerHTML = html;
    })
    .catch(function(){
      document.getElementById('blogGrid').innerHTML = '<p class="blog-empty">Articles coming soon.</p>';
    });
}
</script>
</body>
</html>
