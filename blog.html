<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title="meta.blogTitle">Blog — Surgronic</title>
<meta name="description" content="Practical notes on surgical instruments and sourcing, from the Surgronic team.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=doc007">
</head>
<body>
<script src="assets/currency.js?v=ccy002"></script>
<script src="app.js?v=doc010"></script>

<main>
<section class="blog-hero">
  <div class="wrap">
    <span class="eyebrow rv" data-i18n="blog.eyebrow">Insights</span>
    <h1 class="rv" data-i18n="blog.title">From the field.</h1>
    <p class="rv" data-i18n="blog.sub">Practical notes on instruments and sourcing.</p>
  </div>
</section>

<section class="blog-list">
  <div class="wrap">
    <div id="blogGrid" class="blog-grid">
      <!-- Articles loaded by JS -->
    </div>
  </div>
</section>
</main>

<script>
document.addEventListener("DOMContentLoaded", function(){
  SG.mountChrome('');
  SG.applyI18n();
  if(window.SurCcy){ SurCcy.init(function(){}); }
  loadArticles();
});

function langSuffix(){
  var l = (window.SG && SG.getLang) ? SG.getLang() : 'en';
  return l === 'fr' ? 'Fr' : l === 'ar' ? 'Ar' : l === 'tr' ? 'Tr' : '';
}
function locField(a, base){
  var s = langSuffix();
  return (s && a[base + s]) || a[base] || '';
}
function loadArticles(){
  fetch('articles/index.json')
    .then(r => r.json())
    .then(data => {
      var grid = document.getElementById('blogGrid');
      if(!data.articles || !data.articles.length){
        grid.innerHTML = '<p class="blog-empty">' + SG.t('blog.empty') + '</p>';
        return;
      }
      var html = '';
      data.articles.forEach(function(a){
        html += '<article class="blog-card">' +
          '<p class="blog-date">' + a.date + '</p>' +
          '<h3><a href="article.html?slug=' + a.slug + '">' + locField(a, 'title') + '</a></h3>' +
          '<p class="blog-summary">' + locField(a, 'summary') + '</p>' +
          '<a class="blog-read" href="article.html?slug=' + a.slug + '">' + SG.t('blog.read') + '</a>' +
          '</article>';
      });
      grid.innerHTML = html;
    })
    .catch(function(){
      document.getElementById('blogGrid').innerHTML = '<p class="blog-empty">' + SG.t('blog.empty') + '</p>';
    });
}
document.addEventListener('surgronic:lang', function(){ SG.applyI18n(); loadArticles(); });
</script>

<script>
(function(){
  var els = document.querySelectorAll(".rv");
  if (!("IntersectionObserver" in window)) {
    els.forEach(function(e){ e.classList.add("in"); });
    return;
  }
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
  }, {threshold:.12});
  els.forEach(function(e){ io.observe(e); });
})();
</script>
</body>
</html>
