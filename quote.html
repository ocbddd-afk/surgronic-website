<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-title="meta.quoteTitle">Request a Quote — Surgronic</title>
<meta name="description" content="Build your instrument quote list and request a quotation. Response within one business day.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=promise001">
</head>
<body>
<script src="app.js?v=livecount1"></script>

<div class="container" style="padding-bottom:96px">
  <div class="breadcrumb"><a href="index.html" data-i18n="pd.breadcrumb">Home</a> &rarr; <span data-i18n="q.crumb">Request a Quote</span></div>
  <span class="eyebrow" data-i18n="q.eyebrow">Quotation request</span>
  <h2 class="section-title" data-i18n="q.title">Request a quotation.</h2>
  <p class="section-sub" data-i18n="q.sub">Review your selection, add any references or a photograph, and send. We respond within one business day.</p>

  <div id="quoteApp"></div>
</div>

<script>
(function(){
  var app = document.getElementById("quoteApp");
  var WA = "905526081432";
  var selectedPhotoFile = null; /* shared by bindPhoto() and encodePhoto() */

  function basketItemName(i){
    var l = SG.getLang();
    if(l==="fr" && i.nameFr) return i.nameFr;
    if(l==="ar" && i.nameAr) return i.nameAr;
    return i.name;
  }

  function render(){
    var b = SG.getBasket();
    if(!b.length){
      app.innerHTML =
        '<div class="error-box" style="margin-top:32px">'+SG.t("q.empty")+' '+
        '<a href="catalogue.html" style="font-weight:600;color:var(--bronze-dark)">'+SG.t("q.emptyBrowse")+'</a> '+
        SG.t("q.emptyOr")+'</div>'
        + '<div class="quote-layout" style="grid-template-columns:1fr;max-width:640px"><div>'+formHTML()+'</div></div>';
      bindForm();
      return;
    }
    var items = b.map(function(i,idx){
      var nm = basketItemName(i);
      var img = i.image
        ? '<img src="./assets/'+SG.esc(i.image)+'" alt="">'
        : '<div style="width:96px;height:72px;background:var(--bg-soft);border-radius:var(--radius-sm)"></div>';
      return '<div class="qitem">'+img+
        '<div class="qi-body"><b>'+SG.esc(nm)+'</b><small>'+SG.esc(i.sku)+(i.brand?" &middot; "+SG.esc(i.brand):"")+'</small></div>'+
        '<div class="qty"><button data-dec="'+idx+'" aria-label="'+SG.t("q.dec")+'">&minus;</button><b>'+i.qty+'</b><button data-inc="'+idx+'" aria-label="'+SG.t("q.inc")+'">+</button></div>'+
        '<button class="qremove" data-rm="'+idx+'">'+SG.t("q.remove")+'</button>'+
      '</div>';
    }).join("");
    var n = SG.basketCount();
    app.innerHTML =
      '<div class="quote-layout">'+
        '<div class="quote-items"><h3>'+SG.t("q.yourRequest")+' &mdash; '+n+' '+(n!==1?SG.t("q.units"):SG.t("q.unit"))+'</h3>'+items+
          '<div style="margin-top:16px"><a class="btn btn-outline" href="catalogue.html">'+SG.t("q.addMore")+'</a></div>'+
        '</div>'+
        '<div>'+formHTML()+'</div>'+
      '</div>';
    bindItems(); bindForm();
    /* Update WhatsApp basket link */
    var qwa = document.getElementById("qwa");
    if(qwa && SG.waBasketUrl) qwa.href = SG.waBasketUrl();
  }

  function formHTML(){
    return '<form class="qform" id="qform">'+
      '<h3>'+SG.t("q.formTitle")+'</h3>'+
      '<p class="qform-sub">'+SG.t("q.formSub")+'</p>'+
      '<label for="qn">'+SG.t("q.name")+'</label><input id="qn" required autocomplete="name" placeholder="'+SG.t("q.namePh")+'">'+
      '<label for="qe">'+SG.t("q.email")+'</label><input id="qe" type="email" required autocomplete="email" placeholder="'+SG.t("q.emailPh")+'">'+
      '<label for="qc">'+SG.t("q.company")+'</label><input id="qc" autocomplete="organization" placeholder="'+SG.t("q.companyPh")+'">'+
      '<label for="qco">'+SG.t("q.country")+'</label><input id="qco" autocomplete="country-name" placeholder="'+SG.t("q.countryPh")+'">'+
      '<label for="qref">'+SG.t("q.ref")+'</label><input id="qref" placeholder="'+SG.t("q.refPh")+'">'+
      '<label for="qnotes">'+SG.t("q.specs")+'</label><textarea id="qnotes" rows="4" placeholder="'+SG.t("q.specsPh")+'"></textarea>'+
      '<label for="qphoto">'+SG.t("q.photo")+'</label>'+
      '<div class="qphoto-zone" id="qphotoZone">'+
        '<label class="qphoto-drop" id="qphotoDrop" for="qphoto">'+
          '<span data-i18n="q.photoDrop">'+SG.t("q.photoDrop")+'</span>'+
          '<small>'+SG.t("q.photoBrowse")+'</small>'+
        '</label>'+
        '<input id="qphoto" type="file" accept="image/*" hidden>'+
        '<div class="qphoto-preview" id="qphotoPreview" hidden>'+
          '<img id="qphotoImg" alt="">'+
          '<span><b>'+SG.t("finder.photoReady")+'</b> &mdash; <span id="qphotoName"></span><br>'+
          '<a href="#" id="qphotoChange">'+SG.t("finder.photoChange")+'</a></span>'+
        '</div>'+
      '</div>'+
      '<p style="font-size:12.5px;color:var(--muted);margin-top:8px">'+SG.t("q.photoNote")+'</p>'+
      '<button class="btn btn-primary" type="submit">'+SG.t("q.submit")+' <span class="arr">&rarr;</span></button>'+
      '<a id="qwa" class="btn btn-outline" style="width:100%;justify-content:center;margin-top:10px" target="_blank" rel="noopener">'+SG.t("q.whatsapp")+'</a>'+
      '<p class="qnote">'+SG.t("q.deposit")+'<br>'+SG.t("q.finalPrice")+'</p>'+
    '</form>';
  }

  function bindItems(){
    app.querySelectorAll("[data-inc]").forEach(function(btn){
      btn.addEventListener("click",function(){
        var b=SG.getBasket(); b[+btn.getAttribute("data-inc")].qty++; SG.saveBasket(b); render();
      });
    });
    app.querySelectorAll("[data-dec]").forEach(function(btn){
      btn.addEventListener("click",function(){
        var b=SG.getBasket(), i=+btn.getAttribute("data-dec");
        b[i].qty=Math.max(1,b[i].qty-1); SG.saveBasket(b); render();
      });
    });
    app.querySelectorAll("[data-rm]").forEach(function(btn){
      btn.addEventListener("click",function(){
        var b=SG.getBasket(); b.splice(+btn.getAttribute("data-rm"),1); SG.saveBasket(b); render();
      });
    });
  }

  function collect(){
    var b = SG.getBasket();
    return {
      items: b.map(function(i){return {sku:i.sku,name:basketItemName(i),brand:i.brand,qty:i.qty};}),
      contact: {
        name: document.getElementById("qn").value.trim(),
        email: document.getElementById("qe").value.trim(),
        company: document.getElementById("qc").value.trim(),
        country: document.getElementById("qco").value.trim()
      },
      reference: document.getElementById("qref").value.trim(),
      notes: document.getElementById("qnotes").value.trim(),
      photo: null // filled by encodePhoto() before submit
    };
  }

  /* Resize photo client-side (max 1600px, JPEG 0.82) -> data URL. Returns null if no photo. */
  function encodePhoto(){
    return new Promise(function(resolve){
      if(!selectedPhotoFile){ resolve(null); return; }
      var img = new Image();
      var objUrl = URL.createObjectURL(selectedPhotoFile);
      img.onload = function(){
        try{
          URL.revokeObjectURL(objUrl);
          var max = 1600, w = img.width, h = img.height;
          if(w > max || h > max){ var r = max / Math.max(w, h); w = Math.round(w * r); h = Math.round(h * r); }
          var cv = document.createElement("canvas"); cv.width = w; cv.height = h;
          cv.getContext("2d").drawImage(img, 0, 0, w, h);
          var du = cv.toDataURL("image/jpeg", 0.82);
          resolve({ name: selectedPhotoFile.name, type: "image/jpeg", data: du });
        }catch(e){ resolve(null); }
      };
      img.onerror = function(){ URL.revokeObjectURL(objUrl); resolve(null); };
      img.src = objUrl;
    });
  }
  function waLink(q){
    var lines = q.items.map(function(i){return "- "+i.sku+" / "+i.name+" x"+i.qty;});
    var msg = "Surgronic quotation request\n\n"+lines.join("\n")+"\n\n"+
      (q.reference? "Reference: "+q.reference+"\n":"")+
      (q.notes? "Notes: "+q.notes+"\n":"")+
      (q.photo && q.photo.name ? "Photo to send in chat: "+q.photo.name+"\n(please attach the photo in this chat)\n":"")+
      "\n"+q.contact.name+" ("+q.contact.company+", "+q.contact.country+") "+q.contact.email;
    return "https://wa.me/"+WA+"?text="+encodeURIComponent(msg);
  }

  function bindForm(){
    var f = document.getElementById("qform");
    if(!f) return;
    /* Photo drag-drop with preview + filename confirmation + client resize */
    var selectedPhotoDataUrl = null;
    (function bindPhoto(){
      var drop = document.getElementById("qphotoDrop"),
          input = document.getElementById("qphoto"),
          prev = document.getElementById("qphotoPreview"),
          prevImg = document.getElementById("qphotoImg"),
          nameEl = document.getElementById("qphotoName");
      if(!drop || !input) return;
      function handleFile(file){
        if(!file || !file.type || file.type.indexOf("image/") !== 0) return;
        selectedPhotoFile = file;
        selectedPhotoDataUrl = null; // re-encode on submit
        nameEl.textContent = file.name;
        try{ prevImg.src = URL.createObjectURL(file); prevImg.alt = file.name; }catch(e){}
        prev.hidden = false;
      }
      input.addEventListener("change", function(){
        if(input.files && input.files[0]) handleFile(input.files[0]);
      });
      ["dragenter","dragover"].forEach(function(ev){
        drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add("over"); });
      });
      ["dragleave","drop"].forEach(function(ev){
        drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove("over"); });
      });
      drop.addEventListener("drop", function(e){
        var fl = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if(fl) handleFile(fl);
      });
      var chg = document.getElementById("qphotoChange");
      if(chg) chg.addEventListener("click", function(e){ e.preventDefault(); input.click(); });
    })();
    f.addEventListener("submit",function(ev){
      ev.preventDefault();
      var q = collect();
      var btn = f.querySelector('[type="submit"]');
      btn.disabled = true; btn.textContent = SG.t("q.sending");
      // Encode photo (if any) before sending — resized client-side.
      if(selectedPhotoFile) btn.textContent = SG.t("q.encodingPhoto") || "Preparing photo…";
      encodePhoto().then(function(ph){
        q.photo = ph;
        // Keep filename for the WhatsApp path even if encoding failed.
        if(!ph && selectedPhotoFile) q.photo = { name: selectedPhotoFile.name, type: "", data: "" };
        /* Send photo + RFQ summary straight to yusuf@surgronic.com via FormSubmit
           (instant, no backend needed). Runs in parallel with the API record. */
        var emailSent = Promise.resolve(false);
        if(q.photo && q.photo.data){
          btn.textContent = SG.t("q.sendingPhoto") || "Sending photo…";
          emailSent = sendPhotoEmail(q).catch(function(){ return false; });
        }
        var apiDone = SG.api("submitRfq",q).then(function(res){
          q.photoReceived = res && res.photoReceived;
          return false;
        }).catch(function(){ return true; });
        Promise.all([emailSent, apiDone]).then(function(r){
          q.photoEmailed = r[0];
          done(r[1]);
        });
      });
      /* Direct photo email to yusuf@surgronic.com (FormSubmit AJAX, activated address). */
      function sendPhotoEmail(q){
        return new Promise(function(resolve){
          try{
            var fd = new FormData();
            fd.append("_subject", "Surgronic RFQ photo — " + (q.contact.name || q.contact.email || "website"));
            var lines = q.items.map(function(i){return "- "+i.sku+" / "+i.name+" x"+i.qty;});
            fd.append("message",
              "New quotation request with photo (surgronic-website)\n\n" +
              "Items:\n" + lines.join("\n") + "\n\n" +
              (q.reference ? "Reference: " + q.reference + "\n" : "") +
              (q.notes ? "Notes: " + q.notes + "\n" : "") +
              "\nName: " + q.contact.name + "\nEmail: " + q.contact.email +
              "\nCompany: " + q.contact.company + "\nCountry: " + q.contact.country);
            fd.append("reply_to", q.contact.email || "");
            /* data URL -> Blob for the attachment */
            var du = q.photo.data, blob;
            try{
              var parts = du.split(","), mime = (parts[0].match(/data:(.*?);/)||[])[1] || "image/jpeg";
              var bin = atob(parts[1]), arr = new Uint8Array(bin.length);
              for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
              blob = new Blob([arr], {type: mime});
            }catch(e){ resolve(false); return; }
            fd.append("photo", blob, q.photo.name || "photo.jpg");
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://formsubmit.co/ajax/yusuf@surgronic.com", true);
            xhr.timeout = 45000;
            xhr.onload = function(){ resolve(xhr.status >= 200 && xhr.status < 300); };
            xhr.onerror = function(){ resolve(false); };
            xhr.ontimeout = function(){ resolve(false); };
            xhr.send(fd);
          }catch(e){ resolve(false); }
        });
      }
      function done(fallback){
        try{ localStorage.removeItem("surgronic_quote_v2"); }catch(e){}
        SG.updateBasketUI();
        var photoMsg = "";
        if(q.photo && q.photo.name){
          var emailed = q.photoEmailed || q.photoReceived;
          photoMsg = '<p style="margin-top:12px">' +
            (emailed
              ? SG.t("q.photoSent") || ("Photo \"" + SG.esc(q.photo.name) + "\" received — our team will identify it.")
              : SG.t("q.photoWaOnly") || ("Photo \"" + SG.esc(q.photo.name) + "\" — please attach it in the WhatsApp chat.")) +
            '</p>';
        }
        app.innerHTML = '<div class="qsuccess" style="margin-top:32px">'+
          '<h2>'+SG.t("q.successT")+'</h2>'+
          '<p>'+SG.t("q.successThanks")+' '+SG.esc(q.contact.name.split(" ")[0])+'. '+
          (fallback ? SG.t("q.successDfb") : SG.t("q.successD"))+
          '</p>'+ photoMsg +
          '<div style="display:flex;gap:12px;justify-content:center;margin-top:28px;flex-wrap:wrap">'+
            '<a class="btn btn-primary" target="_blank" rel="noopener" href="'+waLink(q)+'">'+SG.t("q.waConfirm")+'</a>'+
            '<a class="btn btn-outline" href="catalogue.html">'+SG.t("q.backCatalog")+'</a>'+
          '</div></div>';
        window.scrollTo({top:0,behavior:"smooth"});
      }
    });
    if(location.hash === "#photo"){
      var ph = document.getElementById("qphoto");
      if(ph){ ph.scrollIntoView({behavior:"smooth",block:"center"}); ph.focus(); }
    }
    /* Prefill reference from ?ref= (finder "Reference" tab); #sourcing scrolls to it */
    try{
      var qp = new URLSearchParams(location.search);
      var prefill = qp.get("ref");
      if(prefill){
        var rf = document.getElementById("qref");
        if(rf && !rf.value) rf.value = prefill;
      }
    }catch(e){}
    if(location.hash === "#sourcing"){
      var rf2 = document.getElementById("qref");
      if(rf2){ rf2.scrollIntoView({behavior:"smooth",block:"center"}); rf2.focus(); }
    }
  }

  render();
  document.addEventListener("surgronic:lang", function(){
    SG.applyI18n();
    render();
  });
})();
</script>
<script>SG.mountChrome("quote");SG.applyI18n();</script>
</body>
</html>
