<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-title="meta.pdTitle">Product — Surgronic</title>
<meta name="description" id="metaDesc" content="Surgical instrument details, specifications, and quotation.">
<link rel="canonical" id="canonicalLink" href="https://surgronic.pages.dev/product.html">
<meta property="og:type" content="product">
<meta property="og:site_name" content="Surgronic">
<meta property="og:title" id="ogTitle" content="Product — Surgronic">
<meta property="og:description" id="ogDesc" content="Surgical instrument details, specifications, and quotation.">
<meta property="og:url" id="ogUrl" content="https://surgronic.pages.dev/product.html">
<meta property="og:image" id="ogImage" content="https://surgronic.pages.dev/assets/logo-on-light.svg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" id="twTitle" content="Product — Surgronic">
<meta name="twitter:description" id="twDesc" content="Surgical instrument details, specifications, and quotation.">
<meta name="twitter:image" id="twImage" content="https://surgronic.pages.dev/assets/logo-on-light.svg">
<script type="application/ld+json" id="productJsonLd">{"@context":"https://schema.org","@type":"Product","name":"Surgronic surgical instrument"}</script>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=doc011">
</head>
<body class="pd-page">
<script src="assets/currency.js?v=ccy003"></script>
<script src="app.js?v=doc019"></script>

<div class="container">
  <div class="breadcrumb"><a href="index.html" data-i18n="pd.breadcrumb">Home</a> → <a href="catalogue.html" data-i18n="pd.catalog">Catalog</a> → <span id="crumbSku" data-i18n="pd.crumb">Product</span></div>
  <div id="pd"></div>
  <div id="relatedWrap" style="margin:70px 0 30px;display:none">
    <h2 class="section-title" style="font-size:32px" data-i18n="pd.related">Related instruments</h2>
    <div class="feat-grid" id="relatedGrid" style="grid-template-columns:repeat(4,1fr)"></div>
  </div>
</div>

<script>
(function(){
  var sku = new URLSearchParams(location.search).get("sku") || "";
  var wrap = document.getElementById("pd");
  document.getElementById("crumbSku").textContent = sku;

  /* Brand from SKU prefix (same mapping as the catalogue's BRAND_SKU, plus
     Rhinoplasty for SUR-RHI / SUR-SET). Used when a product comes from the
     live D1 row, which carries no brand field. */
  function brandFromSku(s){
    if(!s) return "";
    if(s.indexOf("SUR-AES")===0) return "Aesculap";
    if(s.indexOf("SUR-SKL")===0 || s.indexOf("SUR-ART")===0) return "Sklar";
    if(s.indexOf("SUR-DOG")===0) return "DOĞSAN";
    if(s.indexOf("SUR-FAD")===0) return "FADEN MEDIKAL";
    if(s.indexOf("SUR-NSP")===0) return "ERFECEN";
    if(s.indexOf("SUR-INS")===0) return "ADOSN";
    if(s.indexOf("SUR-RHI")===0 || s.indexOf("SUR-SET")===0) return "Rhinoplasty";
    return "";
  }

  function render(){
    if(!sku){
      wrap.innerHTML = '<div class="error-box">'+SG.t("pd.noproduct")+' <a href="catalogue.html">'+SG.t("pd.back")+'</a>.</div>';
      return;
    }
    wrap.innerHTML = '<div class="loading">'+SG.t("pd.loading")+'</div>';
    /* getProduct (snapshot: name/image/price) + D1 row (manufacturer ref, family,
       category) in parallel. The D1 call is best-effort — the page renders from
       the snapshot alone if it fails. */
    Promise.all([
      SG.api("getProduct",{sku:sku}),
      SG.api("listProducts",{search:sku,limit:10}).catch(function(){ return null; })
    ]).then(function(res){
      var d = res[0];
      var p = SG.normProduct(d && d.product);
      /* D1 row (for spec fields AND as fallback when the snapshot lacks the product) */
      var dl = res[1];
      var d1row = null;
      if(dl && dl.products){
        for(var i=0;i<dl.products.length;i++){ if(dl.products[i].sku === sku){ d1row = dl.products[i]; break; } }
        if(!d1row && dl.products.length === 1) d1row = dl.products[0];
      }
      if(!p && d1row){
        /* Not in the static snapshot (newer brands: RHI/SET/DOG/FAD/NSP/INS —
           1,319 of 9,975 products). Use the live D1 row as the product source. */
        p = SG.normProduct(d1row);
        if(!p.brand) p.brand = brandFromSku(p.sku);
        /* D1 rows carry priceCents, not price — normalise so SEO offers work. */
        if(p.price == null && p.priceCents != null) p.price = p.priceCents / 100;
      }
      if(!p){
        wrap.innerHTML = '<div class="error-box">'+SG.t("pd.notfound")+' <a href="catalogue.html">'+SG.t("pd.back")+'</a>.</div>';
        return;
      }
      /* D1 spec fields (manufacturerRef / family / category). The snapshot
         getProduct does not carry them. */
      var spec = {manufacturerRef:null, family:null, category:null};
      if(d1row){
        spec.manufacturerRef = d1row.manufacturerRef || d1row.manufacturer_ref || null;
        spec.family = d1row.family || null;
        spec.category = d1row.category || null;
      }
      var nm = SG.productName(p);
      var ds = SG.productDesc(p);
      document.title = nm + " (" + p.sku + ") — Surgronic";
      /* ---- SEO: per-product title, description, OG/Twitter, canonical, JSON-LD ---- */
      (function setProductSeo(){
        var pageUrl = location.href.split("#")[0];
        var desc = (ds || (nm + " — surgical instrument from Surgronic. Request a quotation.")).replace(/\s+/g, " ").trim();
        if(desc.length > 155) desc = desc.slice(0, 152).replace(/\s+\S*$/, "") + "…";
        var imgAbs = (p.imageFiles && p.imageFiles[0])
          ? location.origin + "/assets/" + p.imageFiles[0]
          : location.origin + "/assets/logo-on-light.svg";
        function setMeta(sel, val){ var el = document.querySelector(sel); if(el) el.setAttribute("content", val); }
        setMeta("#metaDesc", desc);
        setMeta("#ogTitle", document.title); setMeta("#ogDesc", desc); setMeta("#ogUrl", pageUrl); setMeta("#ogImage", imgAbs);
        setMeta("#twTitle", document.title); setMeta("#twDesc", desc); setMeta("#twImage", imgAbs);
        var can = document.getElementById("canonicalLink"); if(can) can.setAttribute("href", pageUrl);
        var ld = {"@context":"https://schema.org","@type":"Product","name":nm,"description":desc,"sku":p.sku,"mpn":p.sku,
          "brand":{"@type":"Brand","name":p.brand||"Surgronic"},"image":[imgAbs],"url":pageUrl};
        if(spec.category) ld.category = spec.category;
        if(p.price != null) ld.offers = {"@type":"Offer","price":p.price,"priceCurrency":p.currency||"USD","url":pageUrl};
        var ldEl = document.getElementById("productJsonLd"); if(ldEl) ldEl.textContent = JSON.stringify(ld);
      })();
      /* ---- Gallery: main image + thumbnails + lightbox (zoom) ---- */
      var files = (p.imageFiles && p.imageFiles.length) ? p.imageFiles : [];
      var mainImg = files.length ? SG.imgUrl(p) : null;
      var gallery;
      if(mainImg){
        var thumbs = files.length > 1
          ? '<div class="pd-thumbs" role="tablist" aria-label="Product photos">' + files.map(function(f, idx){
              var u = "./assets/" + f + "?v=img003";
              return '<button type="button" data-idx="'+idx+'" aria-current="'+(idx===0)+'" aria-label="Photo '+(idx+1)+'"><img src="'+u+'" alt="" loading="lazy" onerror="this.onerror=null;this.src=\'assets/img-placeholder.svg\'"></button>';
            }).join("") + '</div>'
          : '';
        gallery = '<div class="pd-gallery" id="pdGallery"><img id="pdMainImg" src="'+mainImg+'" alt="'+SG.esc(nm)+'" onerror="this.onerror=null;this.src=\'assets/img-placeholder.svg\'">'+
          '<span class="pd-zoom-hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg>'+SG.t("pd.zoomHint")+'</span></div>' + thumbs;
      } else {
        gallery = '<div class="pd-gallery"><span style="color:var(--muted)">'+SG.t("card.imgSoon")+'</span></div>';
      }
      var finishes = (p.finishOptions&&p.finishOptions.length)
        ? p.finishOptions.map(SG.esc).join(", ") : "—";
      /* ---- Spec table: only rows with a real value are shown. Material, length
         and configuration are empty in the database (0 of 9,975 products), so
         they are never listed — unverified specs read "Specification confirmed
         with quotation" instead of an invented value. ---- */
      function specRow(label, val, mono){
        if(val == null || val === "" || val === "—") return "";
        return '<div><dt>'+label+'</dt><dd'+(mono?' class="mono"':'')+'>'+SG.esc(val)+'</dd></div>';
      }
      var specRows =
        specRow(SG.t("pd.ref"), p.sku, true) +
        specRow(SG.t("pd.mfr"), p.brand || null, false) +
        specRow(SG.t("pd.mfrRef"), spec.manufacturerRef, true) +
        specRow(SG.t("pd.family"), spec.family, false) +
        specRow(SG.t("pd.category"), spec.category, false) +
        specRow(SG.t("pd.finishes"), finishes === "—" ? null : finishes, false) +
        specRow(SG.t("pd.price"), SG.t("card.por"), false) +
        specRow(SG.t("pd.avail"), SG.t("pd.availV"), false);
      var specNote = (!spec.manufacturerRef && !spec.family && !spec.category)
        ? '<p class="pd-spec-note">'+SG.t("pd.specNote")+'</p>' : '';
      wrap.innerHTML =
      '<div class="pd-grid">'+ gallery +
        '<div class="pd-info">'+
          '<div class="psku"><span id="pdSkuText">'+SG.esc(p.sku)+'</span><button type="button" class="pd-copy" id="pdCopy" aria-live="polite">'+SG.t("pd.copy")+'</button></div>'+
          '<h1>'+SG.esc(nm)+'</h1>'+
          '<div class="pd-brand">'+SG.esc(p.brand||"")+'</div>'+
          (ds ? '<p class="pd-desc">'+SG.esc(ds)+'</p>' : '')+
          '<div class="pd-actions">'+
            '<button class="btn btn-primary" id="pdAdd">'+SG.t("card.add")+' <span class="arr">&rarr;</span></button>'+
            '<a class="btn btn-wa" id="pdWa" target="_blank" rel="noopener">'+SG.t("q.whatsapp")+'</a>'+
          '</div>'+
          '<div class="pd-meta">'+ specRows +'</div>'+
          specNote +
          '<p style="margin-top:18px;font-size:14px;color:var(--muted)">'+SG.t("pd.disclaimer")+'</p>'+
        '</div>'+
      '</div>'+
      /* Streamlined per-product quote form */
      '<section class="pd-quote" id="pdQuote">'+
        '<h2>'+SG.t("pdq.title")+'</h2>'+
        '<p class="pdq-sub">'+SG.t("pdq.sub")+'</p>'+
        '<form class="pdq-form" id="pdqForm" novalidate>'+
          '<div class="pdq-row">'+
            '<div class="pdq-field"><label for="pdqQty">'+SG.t("pdq.qty")+'</label>'+
            '<input id="pdqQty" type="number" min="1" value="1" inputmode="numeric" required></div>'+
            '<div class="pdq-field pdq-wide"><label for="pdqNotes">'+SG.t("pdq.notes")+'</label>'+
            '<input id="pdqNotes" type="text" placeholder="'+SG.t("pdq.notesPh")+'"></div>'+
          '</div>'+
          '<div class="pdq-row">'+
            '<div class="pdq-field"><label for="pdqName">'+SG.t("pdq.name")+'</label>'+
            '<input id="pdqName" type="text" autocomplete="name" placeholder="'+SG.t("pdq.namePh")+'" required></div>'+
            '<div class="pdq-field"><label for="pdqContact">'+SG.t("pdq.contact")+'</label>'+
            '<input id="pdqContact" type="text" autocomplete="email" placeholder="'+SG.t("pdq.contactPh")+'" required></div>'+
          '</div>'+
          '<div class="pdq-row">'+
            '<div class="pdq-field"><label for="pdqCountry">'+SG.t("pdq.country")+'</label>'+
            '<input id="pdqCountry" type="text" autocomplete="country-name" placeholder="'+SG.t("pdq.countryPh")+'"></div>'+
            '<div class="pdq-field pdq-actions">'+
              '<button class="btn btn-primary pdq-submit" type="submit">'+SG.t("pdq.submit")+'</button>'+
            '</div>'+
          '</div>'+
          '<p class="pdq-err" id="pdqErr" hidden></p>'+
          '<button class="btn btn-wa pdq-wa" id="pdqWa" type="button">'+SG.t("pdq.waSend")+'</button>'+
          '<p class="pdq-note">'+SG.t("pdq.reassure")+'</p>'+
        '</form>'+
        '<div class="pdq-done" id="pdqDone" hidden>'+
          '<h3>'+SG.t("pdq.doneT")+'</h3>'+
          '<p>'+SG.t("pdq.doneD")+'</p>'+
          '<div class="pdq-done-btns">'+
            '<a class="btn btn-wa" id="pdqDoneWa" target="_blank" rel="noopener">'+SG.t("pdq.waSend")+'</a>'+
            '<a class="btn btn-outline" href="quote.html">'+SG.t("pdq.viewQuote")+'</a>'+
          '</div>'+
        '</div>'+
      '</section>'+
      /* Lightbox (gallery zoom) */
      '<div class="pd-lightbox" id="pdLightbox" hidden role="dialog" aria-modal="true" aria-label="'+SG.esc(nm)+'">'+
        '<button type="button" class="lb-close" id="lbClose" aria-label="Close">×</button>'+
        (files.length > 1 ? '<button type="button" class="lb-nav lb-prev" id="lbPrev" aria-label="Previous photo">‹</button><button type="button" class="lb-nav lb-next" id="lbNext" aria-label="Next photo">›</button>' : '')+
        '<img id="lbImg" src="" alt="'+SG.esc(nm)+'">'+
        '<div class="lb-cap" id="lbCap"></div>'+
      '</div>'+
      /* Sticky mobile CTA bar */
      '<div class="pd-sticky-cta" id="pdStickyCta">'+
        '<button class="btn btn-primary" id="pdStickyAdd">'+SG.t("card.add")+' <span class="arr">&rarr;</span></button>'+
        '<a class="btn btn-wa" id="pdStickyWa" target="_blank" rel="noopener">'+SG.t("q.whatsapp")+'</a>'+
      '</div>';
      document.getElementById("pdAdd").addEventListener("click",function(){
        SG.addToQuote(p,1); this.textContent = SG.t("pd.added");
      });
      /* Product WhatsApp (top actions) */
      var waTop = document.getElementById("pdWa");
      if(waTop && SG.waProductUrl) waTop.href = SG.waProductUrl(p, nm, 1);
      /* Sticky mobile CTA (same actions) */
      var stAdd = document.getElementById("pdStickyAdd"), stWa = document.getElementById("pdStickyWa");
      if(stAdd) stAdd.addEventListener("click",function(){ SG.addToQuote(p,1); this.textContent = SG.t("pd.added"); });
      if(stWa && SG.waProductUrl) stWa.href = SG.waProductUrl(p, nm, 1);
      /* SKU copy button */
      var copyBtn = document.getElementById("pdCopy");
      if(copyBtn) copyBtn.addEventListener("click",function(){
        var txt = p.sku, btn = this;
        function done(){ btn.textContent = SG.t("pd.copied"); setTimeout(function(){ btn.textContent = SG.t("pd.copy"); }, 2000); }
        if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done, function(){ fallback(); }); }
        else fallback();
        function fallback(){
          var ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select();
          try{ document.execCommand("copy"); }catch(e){}
          document.body.removeChild(ta); done();
        }
      });
      /* Gallery: thumbnails + lightbox */
      (function bindGallery(){
        var main = document.getElementById("pdMainImg");
        var lb = document.getElementById("pdLightbox"), lbImg = document.getElementById("lbImg"), lbCap = document.getElementById("lbCap");
        if(!main || !lb) return;
        var idx = 0;
        function show(i){
          idx = (i + files.length) % files.length;
          var u = "./assets/" + files[idx] + "?v=img003";
          main.src = u; lbImg.src = u;
          lbCap.textContent = p.sku + " — " + (idx+1) + " / " + files.length;
          var ths = document.querySelectorAll(".pd-thumbs button");
          ths.forEach(function(b, j){ b.setAttribute("aria-current", j===idx ? "true" : "false"); });
        }
        document.querySelectorAll(".pd-thumbs button").forEach(function(b){
          b.addEventListener("click", function(){ show(parseInt(b.getAttribute("data-idx"),10)||0); });
        });
        function openLb(){ if(files.length){ lbImg.src = "./assets/" + files[idx] + "?v=img003"; lbCap.textContent = p.sku + " — " + (idx+1) + " / " + files.length; lb.hidden = false; document.body.style.overflow = "hidden"; } }
        function closeLb(){ lb.hidden = true; document.body.style.overflow = ""; }
        main.addEventListener("click", openLb);
        document.getElementById("lbClose").addEventListener("click", closeLb);
        lb.addEventListener("click", function(e){ if(e.target === lb) closeLb(); });
        var prev = document.getElementById("lbPrev"), next = document.getElementById("lbNext");
        if(prev) prev.addEventListener("click", function(e){ e.stopPropagation(); show(idx-1); });
        if(next) next.addEventListener("click", function(e){ e.stopPropagation(); show(idx+1); });
        document.addEventListener("keydown", function(e){
          if(lb.hidden) return;
          if(e.key === "Escape") closeLb();
          if(e.key === "ArrowLeft") show(idx-1);
          if(e.key === "ArrowRight") show(idx+1);
        });
      })();
      /* Per-product quote form */
      (function bindPdq(){
        var form = document.getElementById("pdqForm");
        if(!form) return;
        var qtyEl = document.getElementById("pdqQty"),
            notesEl = document.getElementById("pdqNotes"),
            nameEl = document.getElementById("pdqName"),
            contactEl = document.getElementById("pdqContact"),
            countryEl = document.getElementById("pdqCountry"),
            errEl = document.getElementById("pdqErr"),
            waBtn = document.getElementById("pdqWa");
        function showErr(msg){ errEl.textContent = msg; errEl.hidden = false; }
        function clearErr(){ errEl.hidden = true; errEl.textContent = ""; }
        function waFor(qty){
          return SG.waProductUrl(p, nm, qty||parseInt(qtyEl.value,10)||1);
        }
        waBtn.href = waFor(1);
        qtyEl.addEventListener("input", function(){ waBtn.href = waFor(); });
        waBtn.addEventListener("click", function(){
          window.open(waFor(), "_blank", "noopener");
        });
        form.addEventListener("submit", function(ev){
          ev.preventDefault(); clearErr();
          var qty = parseInt(qtyEl.value,10);
          if(!qty || qty < 1){ showErr(SG.t("pdq.errQty")); qtyEl.focus(); return; }
          if(!nameEl.value.trim()){ showErr(SG.t("pdq.errName")); nameEl.focus(); return; }
          if(!contactEl.value.trim()){ showErr(SG.t("pdq.errContact")); contactEl.focus(); return; }
          /* Save to quote basket with quantity */
          SG.addToQuote(p, qty);
          /* Build RFQ payload incl. contact details */
          var rfq = {
            items:[{sku:p.sku, name:nm, brand:p.brand, qty:qty}],
            contact:{name:nameEl.value.trim(), email:contactEl.value.trim(), company:"", country:countryEl.value.trim()},
            reference:"", notes:notesEl.value.trim()
          };
          var btn = form.querySelector('[type="submit"]');
          btn.disabled = true; btn.textContent = SG.t("q.sending");
          function done(){
            document.getElementById("pdqDoneWa").href = waFor(qty);
            form.hidden = true;
            document.getElementById("pdqDone").hidden = false;
            document.getElementById("pdQuote").scrollIntoView({behavior:"smooth",block:"center"});
          }
          SG.api("submitRfq", rfq).then(done).catch(done);
        });
      })();
      if(p.brand){
        SG.api("listProducts",{limit:4,offset:0,manufacturer:p.brand,storefront:true}).then(function(r){
          var rel=(r.products||[]).filter(function(x){return x.sku!==p.sku;}).slice(0,4);
          if(rel.length){
            document.getElementById("relatedWrap").style.display="block";
            document.getElementById("relatedGrid").innerHTML=rel.map(SG.cardHTML).join("");
            SG.bindAddButtons(document.getElementById("relatedGrid"));
          }
        }).catch(function(){});
      }
    }).catch(function(){
      wrap.innerHTML = '<div class="error-box">'+SG.t("pd.unreachable")+'</div>';
    });
  }
  render();
  document.addEventListener("surgronic:lang", function(){
    SG.applyI18n();
    render();
  });
})();
</script>
<script>SG.mountChrome("catalog");SG.applyI18n();</script>
</body>
</html>
