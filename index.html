         per-language URLs (#/en, #/fr, #/ar). The app keeps the
         canonical, hreflang alternates and the localized
         title/description in sync at runtime per view. -->
    <link rel="canonical" href="https://surgronic.pages.dev/#/en" />
    <link rel="alternate" hreflang="en" href="https://surgronic.pages.dev/#/en" />
    <link rel="alternate" hreflang="fr" href="https://surgronic.pages.dev/#/fr" />
    <link rel="alternate" hreflang="ar" href="https://surgronic.pages.dev/#/ar" />
    <link rel="alternate" hreflang="x-default" href="https://surgronic.pages.dev/#/en" />

         by the storefront (product pages carry the product's own

    <meta property="og:type" content="website" />

         ItemList and BreadcrumbList graphs are added per view at
         runtime by the storefront from the live catalogue records. -->

      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",

          "telephone": "+90 552 608 1432",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Sisly",
            "addressLocality": "Istanbul",
            "addressCountry": "TR"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "sales",
            "email": "yusuf@surgronic.com",
            "telephone": "+90 552 608 1432",
            "availableLanguage": ["en", "fr", "ar"]
          }

        {
          "@type": "WebSite",
          "name": "Surgronic",

    <!-- Deploy package marker: this build is the Control Center (admin)
         flavor. The website deploy export rewrites this single value to
         "website" in the website package's index.html; the storefront
         reads it at runtime and removes every Control Center entry
         point when it sees "website" (see Storefront.tsx). -->
    <script>window.__SURGRONIC_PACKAGE__ = "website";</script>

      <p>Surgronic is an international supplier of surgical instruments, based in Sisly, Istanbul, Turkey — selected instruments held in stock, the rest sourced to your exact specification and inspected before shipment. Contact Yusuf — yusuf@surgronic.com · +90 552 608 1432 (also on WhatsApp) — for the catalogue and quotations.</p>

    <script>
      // Register service worker FIRST, then load React app
      // This ensures /actions API is intercepted before the app requests data
      (async function() {
        if ('serviceWorker' in navigator) {
          try {
            const reg = await navigator.serviceWorker.register('./sw.js');
            await navigator.serviceWorker.ready;
            // Force update to ensure latest SW
            if (reg.waiting) reg.waiting.postMessage({type: 'SKIP_WAITING'});
          } catch (e) {}
        }
        // Now load the React app - SW is ready to intercept /actions
        const s = document.createElement('script');
        s.type = 'module';
        s.crossOrigin = 'anonymous';
        s.src = './assets/index-qah0y4z1.js';
        document.body.appendChild(s);
      })();
    </script>
  </body>
