<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-title="meta.catTitle">Instrument Catalog — Surgronic</title>
<meta name="description" content="Search 9,975 surgical instruments by specialty, name, or manufacturer reference.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=doc011">
</head>
<body>
<script src="assets/currency.js?v=ccy003"></script>
<script src="app.js?v=doc018"></script>

<div class="catalog-hero">
  <div class="container">
    <h1 data-i18n="cat.title">Instrument catalogue.</h1>
    <p data-i18n="cat.sub">Guided search across 9,975 catalogued instruments. Filter by specialty, family, and manufacturer.</p>
    <div class="search-bar">
      <input id="q" type="search" data-i18n-ph="cat.searchPh" data-i18n-ph="cat.searchPh" placeholder="Search by name, SKU, or manufacturer reference…" data-i18n-aria="cat.search" aria-label="Search instruments">
      <button class="btn btn-primary" id="searchBtn" data-i18n="cat.search">Search</button>
    </div>
  </div>
</div>

<section style="padding-top:36px">
  <div class="container">
    <div class="filters">
      <select id="fBrand" data-i18n-aria="cat.allMfr" aria-label="Manufacturer">
        <option value="" data-i18n="cat.allMfr">All manufacturers</option>
        <option>Aesculap</option>
        <option>Sklar</option>
        <option>DOĞSAN</option>
        <option>FADEN MEDIKAL</option>
        <option>ERFECEN</option>
        <option>ADOSN</option>
      </select>
      <select id="fSpec" aria-label="Specialty">
        <option value="" data-i18n="cat.allSpec">All specialties</option>
      </select>
      <select id="fFamily" data-i18n-aria="cat.allFam" aria-label="Instrument family">
        <option value="" data-i18n="cat.allFam">All families</option>
        <option data-i18n="fam.forceps">Forceps</option>
        <option data-i18n="fam.scissors">Scissors</option>
        <option data-i18n="fam.retractor">Retractor</option>
        <option data-i18n="fam.clamp">Clamp</option>
        <option data-i18n="fam.needleHolder">Needle Holder</option>
        <option data-i18n="fam.speculum">Speculum</option>
        <option data-i18n="fam.elevator">Elevator</option>
      </select>
      <select id="fSort" aria-label="Sort">
        <option value="name" data-i18n="cat.sortName">Sort: Name</option>
        <option value="sku" data-i18n="cat.sortSku">Sort: Reference</option>
        <option value="brand" data-i18n="cat.sortBrand">Sort: Brand</option>
      </select>
    </div>
    <div class="catalog-meta">
      <span id="metaCount" data-i18n="cat.loading">Loading catalogue…</span>
      <span id="metaPage"></span>
    </div>
    <div class="catalog-grid" id="grid"></div>
    <div class="pagination" id="pager"></div>
    <div class="cant-find rv in" style="margin:56px 0 24px;text-align:center;background:var(--navy-950);border-radius:var(--radius-lg);padding:48px 32px;color:#fff">
      <h2 style="font-family:var(--font-display);font-size:clamp(1.3rem,2.6vw,1.8rem);margin-bottom:10px" data-i18n="cat.photoT">Can&rsquo;t find it?</h2>
      <p style="color:rgba(255,255,255,.75);margin-bottom:24px;max-width:52ch;margin-inline:auto" data-i18n="cat.photoD">Send us a photograph of the instrument — our team identifies it manually and quotes you within one business day.</p>
      <a class="btn btn-primary" href="quote.html#photo"><span data-i18n="cat.photoB">Send a photo</span> &rarr;</a>
    </div>
  </div>
</section>

<script>
(function(){
  var PER = 48, page = 1, total = 0;
  var grid = document.getElementById("grid"),
      metaCount = document.getElementById("metaCount"),
      metaPage = document.getElementById("metaPage"),
      pager = document.getElementById("pager");

  function params(){
    var p = new URLSearchParams(location.search);
    return {
      q: document.getElementById("q").value.trim() || p.get("q") || p.get("search") || "",
      brand: document.getElementById("fBrand").value,
      family: document.getElementById("fFamily").value,
      spec: document.getElementById("fSpec").value || p.get("cat") || "",
      sort: document.getElementById("fSort").value
    };
  }
  function populateSpecs(){
    var sel = document.getElementById("fSpec");
    var cur = sel.value;
    while(sel.options.length > 1) sel.remove(1);
    var specs = (SG.SPECIALTIES && (SG.SPECIALTIES[SG.getLang()] || SG.SPECIALTIES.en)) || [];
    var enSpecs = (SG.SPECIALTIES && SG.SPECIALTIES.en) || [];
    specs.forEach(function(s, i){
      var o = document.createElement("option");
      o.value = enSpecs[i] ? enSpecs[i][0] : s[0];
      o.textContent = s[0];
      sel.appendChild(o);
    });
    var o2 = document.createElement("option");
    o2.value = "Sutures & Wound Closure"; o2.textContent = "Sutures & Wound Closure";
    sel.appendChild(o2);
    if(cur) sel.value = cur;
  }
  (function(){
    populateSpecs();
    var p = new URLSearchParams(location.search);
    if(p.get("brand")) document.getElementById("fBrand").value = p.get("brand");
    if(p.get("q") || p.get("search")) document.getElementById("q").value = p.get("q") || p.get("search");
    if(p.get("cat")) document.getElementById("fSpec").value = p.get("cat");
  })();

  var BRAND_SKU = {
    "Aesculap": ["SUR-AES"],
    "Sklar": ["SUR-SKL", "SUR-ART"],
    "DO\u011eSAN": ["SUR-DOG"],
    "FADEN MEDIKAL": ["SUR-FAD"],
    "ERFECEN": ["SUR-NSP"],
    "ADOSN": ["SUR-INS"]
  };
  function skeletons(n){
    var h = "";
    for(var i=0;i<(n||12);i++){
      h += '<div class="skel" aria-hidden="true"><div class="sk-img"></div><div class="sk-body"><div class="sk-l" style="width:38%"></div><div class="sk-l" style="width:82%"></div><div class="sk-l" style="width:55%"></div></div></div>';
    }
    return h;
  }
  function load(){
    var f = params();
    var search = f.q;
    if(f.family) search = (search ? search+" " : "") + f.family;
    grid.innerHTML = skeletons(12);
    metaCount.textContent = SG.t("cat.loading");
    // Brand filter: try static data first for new brands (API doesn't return them)
    var STATIC_BRANDS = {"DO\u011eSAN": "do-san", "FADEN MEDIKAL": "faden-medikal", "ERFECEN": "erfecen", "ADOSN": "adosn"};
    var staticFile = f.brand && STATIC_BRANDS[f.brand] ? STATIC_BRANDS[f.brand] : null;
    if (staticFile) {
      // Load from static JSON
      fetch('data/brand-' + staticFile + '.json')
        .then(function(r){ return r.json(); })
        .then(function(d){
          var list = d.products || [];
          total = list.length;
          var start = (page-1)*PER;
          list = list.slice(start, start+PER);
          var pages = Math.max(1, Math.ceil(total/PER));
          metaCount.innerHTML = "<b>"+total.toLocaleString()+"</b> "+SG.t("cat.of")+" <b>"+total.toLocaleString()+"</b> "+SG.t("cat.catalogued");
          metaPage.textContent = SG.t("cat.page")+" "+page+" "+SG.t("cat.of")+" "+pages;
          if(!list.length){
            grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:40px">No products found.</p>';
          } else {
            grid.innerHTML = list.map(SG.cardHTML).join("");
            SG.bindAddButtons(grid);
          }
          renderPager(pages);
          window.scrollTo({top:0,behavior:"smooth"});
        })
        .catch(function(){ grid.innerHTML = '<p>No products found.</p>'; });
      return;
    }
    // Specialty filter: fetch the union (API snapshot + static brand files) and filter client-side.
    // The API compact rows carry no `category`, so fill it from the D1 sku->category
    // map (data/sku-category.json) before applying the specialty rules — otherwise
    // the category-based rules never fire and counts come out far too low.
    // No storefront flag here: the snapshot is the catalogue the site already
    // shows; the flag capped the reachable rows at 5,000 (offsets >=5000 empty).
    if (f.spec && SG.inSpecialty) {
      var pageCalls = [];
      for(var off=0; off<9000; off+=1000){
        pageCalls.push(SG.api("listProducts",{limit:1000, offset:off}).catch(function(){ return {products:[]}; }));
      }
      var catMapCall = fetch('data/sku-category.json').then(function(r){ return r.json(); }).catch(function(){ return {}; });
      var staticCalls = ["do-san","faden-medikal","erfecen","smith---nephew","adosn"].map(function(b){
        return fetch('data/brand-'+b+'.json').then(function(r){ return r.json(); }).catch(function(){ return {products:[]}; });
      });
      Promise.all(pageCalls.concat([catMapCall]).concat(staticCalls)).then(function(results){
        var catMap = results[pageCalls.length] || {};
        var all = [];
        results.forEach(function(r, idx){
          if(idx === pageCalls.length) return; // skip the category map itself
          var list = (r && (r.products || (r.data && r.data.products))) || [];
          all = all.concat(list);
        });
        var seen = {};
        all = all.filter(function(p){ if(!p || !p.sku || seen[p.sku]) return false; seen[p.sku]=1; return true; });
        all.forEach(function(p){ if(!p.category && catMap[p.sku]) p.category = catMap[p.sku]; });
        var list = all.filter(function(p){ return SG.inSpecialty(p, f.spec); });
        if(f.brand && BRAND_SKU[f.brand]){
          var pres = BRAND_SKU[f.brand];
          list = list.filter(function(p){ return p.sku && pres.some(function(pre){ return p.sku.indexOf(pre)===0; }); });
        }
        if(f.q){
          var q = f.q.toLowerCase();
          list = list.filter(function(p){ return ((p.name||"").toLowerCase().indexOf(q)!==-1) || ((p.sku||"").toLowerCase().indexOf(q)!==-1); });
        }
        if(f.family){
          var fam = f.family.toLowerCase();
          list = list.filter(function(p){ return (p.name||"").toLowerCase().indexOf(fam)!==-1; });
        }
        list.sort(function(a,b){
          if(f.sort==="sku") return (a.sku||"").localeCompare(b.sku||"");
          if(f.sort==="brand") return ((a.brand||"")+(a.sku||"")).localeCompare((b.brand||"")+(b.sku||""));
          return SG.productName(a).localeCompare(SG.productName(b));
        });
        total = list.length;
        var pages = Math.max(1, Math.ceil(total/PER));
        if(page>pages) page=pages;
        var start=(page-1)*PER;
        var view=list.slice(start, start+PER);
        metaCount.innerHTML = "<b>"+total.toLocaleString()+"</b> "+SG.t("cat.of")+" <b>9,975</b> "+SG.t("cat.catalogued");
        metaPage.textContent = SG.t("cat.page")+" "+page+" "+SG.t("cat.of")+" "+pages;
        if(!view.length){
          grid.innerHTML = '<div class="error-box" style="grid-column:1/-1;text-align:center;padding:48px 32px">'+
            '<h3 style="font-size:20px;margin-bottom:10px">'+SG.t("cat.empty.t")+'</h3>'+
            '<p style="color:var(--muted);margin-bottom:20px">'+SG.t("cat.empty.d")+'</p>'+
            '<a class="btn btn-primary" href="quote.html">'+SG.t("cat.empty.b")+'</a></div>';
        } else {
          grid.innerHTML = view.map(SG.cardHTML).join("");
          SG.bindAddButtons(grid);
        }
        renderPager(pages);
        window.scrollTo({top:0,behavior:"smooth"});
      }).catch(function(){
        grid.innerHTML = '<div class="error-box" style="grid-column:1/-1">'+SG.t("cat.unavailable")+'</div>';
        metaCount.textContent = SG.t("cat.unavailableShort");
      });
      return;
    }
    // Brand filter via SKU prefix (API manufacturer param is ignored)
    var brandPrefixes = f.brand && BRAND_SKU[f.brand] ? BRAND_SKU[f.brand] : null;
    var fetchLimit = brandPrefixes ? 2000 : PER;
    var fetchOffset = brandPrefixes ? 0 : (page-1)*PER;
    SG.api("listProducts",{
      limit: fetchLimit, offset: fetchOffset,
      search: search || undefined,
      sort: f.sort, storefront:true
    }).then(function(d){
      var list = d.products||[];
      if(brandPrefixes){
        list = list.filter(function(p){
          return p.sku && brandPrefixes.some(function(pre){ return p.sku.indexOf(pre) === 0; });
        });
        total = list.length;
        // Paginate client-side
        var start = (page-1)*PER;
        list = list.slice(start, start+PER);
      } else {
        total = d.total||0;
      }
      metaCount.innerHTML = "<b>"+total.toLocaleString()+"</b> "+SG.t("cat.of")+" <b>9,975</b> "+SG.t("cat.catalogued");
      var pages = Math.max(1, Math.ceil(total/PER));
      metaPage.textContent = SG.t("cat.page")+" "+page+" "+SG.t("cat.of")+" "+pages;
      if(!list.length){
        grid.innerHTML = '<div class="error-box" style="grid-column:1/-1;text-align:center;padding:48px 32px">'+
          '<h3 style="font-size:20px;margin-bottom:10px">'+SG.t("cat.empty.t")+'</h3>'+
          '<p style="color:var(--muted);margin-bottom:20px">'+SG.t("cat.empty.d")+'</p>'+
          '<a class="btn btn-primary" href="quote.html">'+SG.t("cat.empty.b")+'</a></div>';
      } else {
        grid.innerHTML = list.map(SG.cardHTML).join("");
        SG.bindAddButtons(grid);
      }
      renderPager(pages);
      window.scrollTo({top:0,behavior:"smooth"});
    }).catch(function(){
      grid.innerHTML = '<div class="error-box" style="grid-column:1/-1">'+SG.t("cat.unavailable")+'</div>';
      metaCount.textContent = SG.t("cat.unavailableShort");
    });
  }
  function renderPager(pages){
    var h = '<button id="pgPrev" '+(page<=1?"disabled":"")+'>'+SG.t("cat.prev")+'</button>'+
            '<span class="pg-info">'+SG.t("cat.page")+' '+page+' '+SG.t("cat.of")+' '+pages+'</span>'+
            '<button id="pgNext" '+(page>=pages?"disabled":"")+'>'+SG.t("cat.next")+'</button>';
    pager.innerHTML = h;
    document.getElementById("pgPrev").addEventListener("click",function(){ if(page>1){page--;load();} });
    document.getElementById("pgNext").addEventListener("click",function(){ if(page<pages){page++;load();} });
  }
  var deb=null;
  document.getElementById("q").addEventListener("input",function(){
    clearTimeout(deb); deb=setTimeout(function(){page=1;load();},450);
  });
  document.getElementById("searchBtn").addEventListener("click",function(){page=1;load();});
  ["fBrand","fFamily","fSort","fSpec"].forEach(function(id){
    document.getElementById(id).addEventListener("change",function(){page=1;load();});
  });
  load();
  document.addEventListener("surgronic:lang", function(){
    SG.applyI18n();
    populateSpecs();
    load();
  });
})();
</script>
<script>SG.mountChrome("catalog");SG.applyI18n();</script>
</body>
</html>
