<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request a Quote — Surgronic</title>
<meta name="description" content="Build your instrument quote list and request a quotation. Response within one business day.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<script src="app.js"></script>
<script>SG.mountChrome("quote");</script>

<div class="container" style="padding-bottom:96px">
  <div class="breadcrumb"><a href="index.html">Home</a> &rarr; Request a Quote</div>
  <span class="eyebrow">Quotation request</span>
  <h2 class="section-title">Request a quotation.</h2>
  <p class="section-sub">Review your selection, add any references or a photograph, and send. We respond within one business day.</p>

  <div id="quoteApp"></div>
</div>

<script>
(function(){
  var app = document.getElementById("quoteApp");
  var WA = "905526081432";

  function render(){
    var b = SG.getBasket();
    if(!b.length){
      app.innerHTML =
        '<div class="error-box" style="margin-top:32px">Your quote list is empty. '+
        '<a href="catalogue.html" style="font-weight:600;color:var(--bronze-dark)">Browse the catalog</a> '+
        'or describe the instrument you need below &mdash; you can still send a sourcing request with no items.</div>'
        + '<div class="quote-layout" style="grid-template-columns:1fr;max-width:640px"><div>'+formHTML(true)+'</div></div>';
      bindForm();
      return;
    }
    var items = b.map(function(i,idx){
      var img = i.image
        ? '<img src="./assets/'+SG.esc(i.image)+'" alt="">'
        : '<div style="width:96px;height:72px;background:var(--bg-soft);border-radius:var(--radius-sm)"></div>';
      return '<div class="qitem">'+img+
        '<div class="qi-body"><b>'+SG.esc(i.name)+'</b><small>'+SG.esc(i.sku)+(i.brand?" &middot; "+SG.esc(i.brand):"")+'</small></div>'+
        '<div class="qty"><button data-dec="'+idx+'" aria-label="Decrease">&minus;</button><b>'+i.qty+'</b><button data-inc="'+idx+'" aria-label="Increase">+</button></div>'+
        '<button class="qremove" data-rm="'+idx+'">Remove</button>'+
      '</div>';
    }).join("");
    app.innerHTML =
      '<div class="quote-layout">'+
        '<div class="quote-items"><h3>Your Request &mdash; '+SG.basketCount()+' unit'+(SG.basketCount()!==1?"s":"")+'</h3>'+items+
          '<div style="margin-top:16px"><a class="btn btn-outline" href="catalogue.html">Add More Instruments</a></div>'+
        '</div>'+
        '<div>'+formHTML(false)+'</div>'+
      '</div>';
    bindItems(); bindForm();
  }

  function formHTML(){
    return '<form class="qform" id="qform">'+
      '<h3>Request Quotation</h3>'+
      '<p class="qform-sub">No online payment required. Receive a quotation based on your specifications.</p>'+
      '<label for="qn">Full name</label><input id="qn" required autocomplete="name" placeholder="Dr. Jane Smith">'+
      '<label for="qe">Work email</label><input id="qe" type="email" required autocomplete="email" placeholder="name@hospital.org">'+
      '<label for="qc">Company / Institution</label><input id="qc" autocomplete="organization" placeholder="Hospital or distributor name">'+
      '<label for="qco">Country</label><input id="qco" autocomplete="country-name" placeholder="United Arab Emirates">'+
      '<label for="qref">Product reference</label><input id="qref" placeholder="Manufacturer article number, if known">'+
      '<label for="qnotes">Specifications</label><textarea id="qnotes" rows="4" placeholder="Sizes, materials, finishes, quantities&hellip;"></textarea>'+
      '<label for="qphoto">Product photo</label><input id="qphoto" type="file" accept="image/*">'+
      '<p style="font-size:12.5px;color:var(--muted);margin-top:8px">Photos go to our team for manual identification &mdash; never presented as automated recognition.</p>'+
      '<button class="btn btn-primary" type="submit">Request Quotation <span class="arr">&rarr;</span></button>'+
      '<p class="qnote">Deposit refundable minus costs already committed to the supplier.<br>Final price confirmed in writing.</p>'+
    '</form>';
  }

  function bindItems(){
    app.querySelectorAll("[data-inc]").forEach(function(btn){
      btn.addEventListener("click",function(){
        var b=SG.getBasket(); b[+btn.getAttribute("data-inc")].qty++; SG.saveBasket(b); render();
      });
    });
    app.querySelectorAll("[data-dec]").forEach(function(btn){
      btn.addEventListener("click",function(){
        var b=SG.getBasket(), i=+btn.getAttribute("data-dec");
        b[i].qty=Math.max(1,b[i].qty-1); SG.saveBasket(b); render();
      });
    });
    app.querySelectorAll("[data-rm]").forEach(function(btn){
      btn.addEventListener("click",function(){
        var b=SG.getBasket(); b.splice(+btn.getAttribute("data-rm"),1); SG.saveBasket(b); render();
      });
    });
  }

  function collect(){
    var b = SG.getBasket();
    return {
      items: b.map(function(i){return {sku:i.sku,name:i.name,brand:i.brand,qty:i.qty};}),
      contact: {
        name: document.getElementById("qn").value.trim(),
        email: document.getElementById("qe").value.trim(),
        company: document.getElementById("qc").value.trim(),
        country: document.getElementById("qco").value.trim()
      },
      reference: document.getElementById("qref").value.trim(),
      notes: document.getElementById("qnotes").value.trim()
    };
  }
  function waLink(q){
    var lines = q.items.map(function(i){return "- "+i.sku+" / "+i.name+" x"+i.qty;});
    var msg = "Surgronic quotation request\n\n"+lines.join("\n")+"\n\n"+
      (q.reference? "Reference: "+q.reference+"\n":"")+
      (q.notes? "Notes: "+q.notes+"\n":"")+
      "\n"+q.contact.name+" ("+q.contact.company+", "+q.contact.country+") "+q.contact.email;
    return "https://wa.me/"+WA+"?text="+encodeURIComponent(msg);
  }

  function bindForm(){
    var f = document.getElementById("qform");
    if(!f) return;
    f.addEventListener("submit",function(ev){
      ev.preventDefault();
      var q = collect();
      var btn = f.querySelector('[type="submit"]');
      btn.disabled = true; btn.textContent = "Sending\u2026";
      SG.api("submitRfq",q).then(function(){ done(false); }).catch(function(){ done(true); });
      function done(fallback){
        try{ localStorage.removeItem("surgronic_quote_v2"); }catch(e){}
        SG.updateBasketUI();
        app.innerHTML = '<div class="qsuccess" style="margin-top:32px">'+
          '<h2>Request received.</h2>'+
          '<p>Thank you, '+SG.esc(q.contact.name.split(" ")[0])+'. '+
          (fallback
            ? 'Our API is temporarily unreachable &mdash; please confirm via WhatsApp so nothing is lost.'
            : 'Our team will respond within one business day.')+
          '</p>'+
          '<div style="display:flex;gap:12px;justify-content:center;margin-top:28px;flex-wrap:wrap">'+
            '<a class="btn btn-primary" target="_blank" rel="noopener" href="'+waLink(q)+'">Confirm via WhatsApp</a>'+
            '<a class="btn btn-outline" href="catalogue.html">Back to catalog</a>'+
          '</div></div>';
        window.scrollTo({top:0,behavior:"smooth"});
      }
    });
    if(location.hash === "#photo"){
      var ph = document.getElementById("qphoto");
      if(ph){ ph.scrollIntoView({behavior:"smooth",block:"center"}); ph.focus(); }
    }
  }

  render();
})();
</script>
</body>
</html>
