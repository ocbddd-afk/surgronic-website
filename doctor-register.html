<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Registration — Surgronic</title>
<meta name="description" content="Create your Surgronic doctor account. Verified doctors get faster quotes, order history, and inventory tools.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=doc009">
</head>
<body>
<script src="assets/currency.js?v=ccy002"></script>
<script src="app.js?v=doc014"></script>

<main>
<section class="doc-hero">
  <div class="wrap">
    <span class="eyebrow rv" data-i18n="doc.eyebrow">Doctors</span>
    <h1 class="rv" data-i18n="doc.regTitle">Open your doctor account.</h1>
    <p class="rv" data-i18n="doc.regLede">Verified doctors get faster quotations, order history, and inventory tools for their practice.</p>
  </div>
</section>

<section class="doc-form-sec">
  <div class="wrap mani-narrow">
    <form id="docRegForm" class="doc-form">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName" data-i18n="doc.firstName">First name *</label>
          <input type="text" id="firstName" required>
        </div>
        <div class="form-group">
          <label for="lastName" data-i18n="doc.lastName">Family name *</label>
          <input type="text" id="lastName" required>
        </div>
      </div>
      <div class="form-group">
        <label for="email" data-i18n="doc.emailReq">Email address *</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="phone"><span data-i18n="doc.phone">Phone number</span> <span class="opt" data-i18n="doc.optional">(optional)</span></label>
        <input type="tel" id="phone">
      </div>
      <div class="form-group">
        <label for="specialty" data-i18n="doc.specialty">Medical specialty *</label>
        <select id="specialty" required>
          <option value="" data-i18n="doc.selectSpec">Select specialty…</option>
          <option data-i18n="doc.spec0">General Surgery</option>
          <option data-i18n="doc.spec1">Orthopedics &amp; Trauma</option>
          <option data-i18n="doc.spec2">Oral &amp; Maxillofacial</option>
          <option data-i18n="doc.spec3">Plastic / Reconstructive / Aesthetic</option>
          <option data-i18n="doc.spec4">Cardiovascular &amp; Thoracic</option>
          <option data-i18n="doc.spec5">Neurosurgery &amp; Spine</option>
          <option data-i18n="doc.spec6">Ophthalmology</option>
          <option data-i18n="doc.spec7">ENT</option>
          <option data-i18n="doc.spec8">OB/GYN &amp; Urology</option>
          <option data-i18n="doc.spec9">Dental &amp; Implant</option>
          <option data-i18n="doc.spec10">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="license" data-i18n="doc.license">Medical license / certificate (PDF or photo) *</label>
        <input type="file" id="license" accept=".pdf,image/*" required>
        <p class="form-hint" data-i18n="doc.licenseHint">Upload your doctor license or certification. Our team verifies every application manually.</p>
      </div>
      <div class="form-group">
        <label for="password" data-i18n="doc.password">Create password *</label>
        <input type="password" id="password" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn" data-i18n="doc.submit">Submit application</button>
      <p class="form-note" id="formNote"></p>
    </form>
    <p class="doc-login-link"><span data-i18n="doc.haveAccount">Already have an account? </span><a href="doctor-login.html" data-i18n="doc.loginLink">Log in as doctor</a></p>
  </div>
</section>
</main>

<script>
document.addEventListener("DOMContentLoaded", function(){
  SG.mountChrome('');
  SG.applyI18n();
  if(window.SurCcy){ SurCcy.init(function(){}); }
  initReveal();
  document.getElementById('docRegForm').addEventListener('submit', handleRegister);
});

function initReveal(){
  var els = document.querySelectorAll(".rv");
  if (!("IntersectionObserver" in window)) { els.forEach(function(e){ e.classList.add("in"); }); return; }
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
  }, {threshold:.12});
  els.forEach(function(e){ io.observe(e); });
}

async function handleRegister(e){
  e.preventDefault();
  var btn = document.getElementById('submitBtn');
  var note = document.getElementById('formNote');
  btn.disabled = true;
  btn.textContent = SG.t("doc.submitting");

  var data = {
    firstName: document.getElementById('firstName').value.trim(),
    lastName: document.getElementById('lastName').value.trim(),
    email: document.getElementById('email').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    specialty: document.getElementById('specialty').value,
    password: document.getElementById('password').value
  };
  var licenseFile = document.getElementById('license').files[0];

  try {
    // 1. Email application + license to team via FormSubmit
    var formData = new FormData();
    formData.append('name', data.firstName + ' ' + data.lastName);
    formData.append('email', data.email);
    formData.append('phone', data.phone || SG.t("doc.notProvided"));
    formData.append('specialty', data.specialty);
    formData.append('message', 'New doctor account application. Please verify the attached license.');
    if (licenseFile) formData.append('license', licenseFile, licenseFile.name);
    formData.append('_subject', SG.t("doc.appSubject") + data.firstName + ' ' + data.lastName);
    formData.append('_template', 'table');

    await fetch('https://formsubmit.co/ajax/yusuf@surgronic.com', {
      method: 'POST',
      body: formData
    });

    // 2. Store pending account locally (awaiting verification)
    var pending = JSON.parse(localStorage.getItem('sur_doc_pending') || '[]');
    // Simple hash for password (not secure, prototype only)
    var hash = btoa(data.password).split('').reverse().join('');
    pending.push({
      firstName: data.firstName,
      lastName: data.lastName,
      email: data.email.toLowerCase(),
      phone: data.phone,
      specialty: data.specialty,
      passHash: hash,
      status: 'pending',
      appliedAt: new Date().toISOString()
    });
    localStorage.setItem('sur_doc_pending', JSON.stringify(pending));

    note.style.color = 'green';
    note.textContent = SG.t("doc.received");
    document.getElementById('docRegForm').reset();
  } catch(err) {
    note.style.color = 'red';
    note.textContent = SG.t("doc.error");
  }
  btn.disabled = false;
  btn.textContent = SG.t("doc.submit");
}
</script>
</body>
</html>
