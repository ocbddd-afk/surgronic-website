<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Registration — Surgronic</title>
<meta name="description" content="Create your Surgronic doctor account. Verified doctors get faster quotes, order history, and inventory tools.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=doc002">
</head>
<body>
<script src="assets/currency.js"></script>
<script src="app.js?v=doc002"></script>

<main>
<section class="doc-hero">
  <div class="wrap">
    <span class="eyebrow rv">Doctors</span>
    <h1 class="rv">Open your doctor account.</h1>
    <p class="rv">Verified doctors get faster quotations, order history, and inventory tools for their practice.</p>
  </div>
</section>

<section class="doc-form-sec">
  <div class="wrap mani-narrow">
    <form id="docRegForm" class="doc-form">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First name *</label>
          <input type="text" id="firstName" required>
        </div>
        <div class="form-group">
          <label for="lastName">Family name *</label>
          <input type="text" id="lastName" required>
        </div>
      </div>
      <div class="form-group">
        <label for="email">Email address *</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="phone">Phone number <span class="opt">(optional)</span></label>
        <input type="tel" id="phone">
      </div>
      <div class="form-group">
        <label for="specialty">Medical specialty *</label>
        <select id="specialty" required>
          <option value="">Select specialty…</option>
          <option>General Surgery</option>
          <option>Orthopedics & Trauma</option>
          <option>Oral & Maxillofacial</option>
          <option>Plastic / Reconstructive / Aesthetic</option>
          <option>Cardiovascular & Thoracic</option>
          <option>Neurosurgery & Spine</option>
          <option>Ophthalmology</option>
          <option>ENT</option>
          <option>OB/GYN & Urology</option>
          <option>Dental & Implant</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="license">Medical license / certificate (PDF or photo) *</label>
        <input type="file" id="license" accept=".pdf,image/*" required>
        <p class="form-hint">Upload your doctor license or certification. Our team verifies every application manually.</p>
      </div>
      <div class="form-group">
        <label for="password">Create password *</label>
        <input type="password" id="password" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Submit application</button>
      <p class="form-note" id="formNote"></p>
    </form>
    <p class="doc-login-link">Already have an account? <a href="doctor-login.html">Log in as doctor</a></p>
  </div>
</section>
</main>

<script>
document.addEventListener("DOMContentLoaded", function(){
  SG.mountChrome('');
  SG.applyI18n();
  if(window.SurCcy){ SurCcy.init(function(){}); }
  initReveal();
  document.getElementById('docRegForm').addEventListener('submit', handleRegister);
});

function initReveal(){
  var els = document.querySelectorAll(".rv");
  if (!("IntersectionObserver" in window)) { els.forEach(function(e){ e.classList.add("in"); }); return; }
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
  }, {threshold:.12});
  els.forEach(function(e){ io.observe(e); });
}

async function handleRegister(e){
  e.preventDefault();
  var btn = document.getElementById('submitBtn');
  var note = document.getElementById('formNote');
  btn.disabled = true;
  btn.textContent = 'Submitting…';

  var data = {
    firstName: document.getElementById('firstName').value.trim(),
    lastName: document.getElementById('lastName').value.trim(),
    email: document.getElementById('email').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    specialty: document.getElementById('specialty').value,
    password: document.getElementById('password').value
  };
  var licenseFile = document.getElementById('license').files[0];

  try {
    // 1. Email application + license to team via FormSubmit
    var formData = new FormData();
    formData.append('name', data.firstName + ' ' + data.lastName);
    formData.append('email', data.email);
    formData.append('phone', data.phone || 'Not provided');
    formData.append('specialty', data.specialty);
    formData.append('message', 'New doctor account application. Please verify the attached license.');
    if (licenseFile) formData.append('license', licenseFile, licenseFile.name);
    formData.append('_subject', 'Doctor Application: ' + data.firstName + ' ' + data.lastName);
    formData.append('_template', 'table');

    await fetch('https://formsubmit.co/ajax/yusuf@surgronic.com', {
      method: 'POST',
      body: formData
    });

    // 2. Store pending account locally (awaiting verification)
    var pending = JSON.parse(localStorage.getItem('sur_doc_pending') || '[]');
    // Simple hash for password (not secure, prototype only)
    var hash = btoa(data.password).split('').reverse().join('');
    pending.push({
      firstName: data.firstName,
      lastName: data.lastName,
      email: data.email.toLowerCase(),
      phone: data.phone,
      specialty: data.specialty,
      passHash: hash,
      status: 'pending',
      appliedAt: new Date().toISOString()
    });
    localStorage.setItem('sur_doc_pending', JSON.stringify(pending));

    note.style.color = 'green';
    note.textContent = 'Application received! Our team will verify your license and email you when your account is live.';
    document.getElementById('docRegForm').reset();
  } catch(err) {
    note.style.color = 'red';
    note.textContent = 'Something went wrong. Please try again or contact us on WhatsApp.';
  }
  btn.disabled = false;
  btn.textContent = 'Submit application';
}
</script>
</body>
</html>
